[project]
name = "plug-play-memory"
version = "0.2.0"
description = "Self-hosted, brain-inspired memory + permissions for AI agents. MCP-native. One SQLite file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tathagat" }]
keywords = ["mcp", "ai-agents", "memory", "permissions", "llm", "opa", "self-hosted", "neuroscience"]
dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.20.0,<2.0.0",
    "sse-starlette<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
vector = ["sqlite-vec>=0.1.9"]
embeddings-local = ["sentence-transformers>=3.0.0"]

[project.scripts]
agentmemory = "plug_play_memory.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plug_play_memory*"]

[tool.setuptools.package-data]
"plug_play_memory" = ["policies/builtin/*.yaml"]
